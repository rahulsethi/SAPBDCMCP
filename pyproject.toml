[project]
name = "sap-bdc-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for SAP Business Data Cloud (BDC)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Your Team" }
]
dependencies = [
  "mcp[cli]>=1.25.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
]

[project.scripts]
sap-bdc-mcp = "sap_bdc_mcp.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
