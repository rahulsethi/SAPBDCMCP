# File: .github/workflows/ci.yml
# Version: v2

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: mypy src/sap_bdc_mcp

      - name: Tests
        run: pytest -q

  npx-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The wrapper boots the Python server via `uvx sap-bdc-mcp@<PIN>`, which only
      # resolves once that version is published to PyPI. Until then we test the
      # wrapper's OWN logic hermetically (no PyPI, no uv install required):
      #   1. it is valid JS,
      #   2. it exits 2 with an install hint when uvx is absent,
      #   3. (Linux) it forwards the correct args + exit code to uvx (via a stub).
      # The real end-to-end boot is verified manually after the PyPI publish.

      - name: Smoke — wrapper is valid JavaScript
        shell: bash
        run: node --check npx-wrapper/bin/sap-bdc-mcp.js

      # Deterministic behavioral test of the wrapper's two branches, hermetic
      # (Linux only — Node on Windows resolves `uvx` to uvx.exe, which a shell
      # stub cannot stand in for). We control PATH ourselves so the result never
      # depends on whether the runner happens to have uvx installed.
      - name: Smoke — wrapper branches (uvx-absent exits 2; uvx-present forwards args)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          node_dir="$(dirname "$(command -v node)")"

          # (a) uvx absent: PATH has only node's dir, so the wrapper cannot find
          #     `which`/`uvx` -> it must print the install hint and exit 2.
          out="$(PATH="$node_dir" node npx-wrapper/bin/sap-bdc-mcp.js --help 2>&1)"; ec=$?
          printf '%s\n' "$out"
          echo "uvx-absent exit code: $ec"
          if [ "$ec" -ne 2 ]; then
            echo "::error::uvx-absent: expected exit 2, got $ec"; exit 1
          fi
          printf '%s\n' "$out" | grep -qi "requires 'uvx'" \
            || { echo "::error::uvx-absent: install hint not printed"; exit 1; }

          # (b) uvx present: a stub uvx (first on PATH) must receive the exact
          #     forwarded args, and the wrapper must relay its exit code (0).
          stub="$(mktemp -d)"
          printf '#!/usr/bin/env bash\necho "STUB_UVX_ARGS: $*"\nexit 0\n' > "$stub/uvx"
          chmod +x "$stub/uvx"
          out="$(PATH="$stub:$node_dir:/usr/bin:/bin" node npx-wrapper/bin/sap-bdc-mcp.js --help)"; ec=$?
          printf '%s\n' "$out"
          echo "uvx-present exit code: $ec"
          if [ "$ec" -ne 0 ]; then
            echo "::error::uvx-present: expected exit 0, got $ec"; exit 1
          fi
          printf '%s\n' "$out" | grep -q -- "STUB_UVX_ARGS: --python 3.11 sap-bdc-mcp@0.2.0 --help" \
            || { echo "::error::uvx-present: wrapper did not forward expected args"; exit 1; }

      - name: Upload wrapper artifact (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: npx-wrapper-${{ matrix.os }}
          path: npx-wrapper/
