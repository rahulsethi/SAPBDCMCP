# File: .github/workflows/ci.yml
# Version: v2

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: mypy src/sap_bdc_mcp

      - name: Tests
        run: pytest -q

  npx-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The wrapper boots the Python server via `uvx sap-bdc-mcp@<PIN>`, which only
      # resolves once that version is published to PyPI. Until then we test the
      # wrapper's OWN logic hermetically (no PyPI, no uv install required):
      #   1. it is valid JS,
      #   2. it exits 2 with an install hint when uvx is absent,
      #   3. (Linux) it forwards the correct args + exit code to uvx (via a stub).
      # The real end-to-end boot is verified manually after the PyPI publish.

      # The wrapper boots the Python server via `uvx sap-bdc-mcp@<PIN>`, which only
      # resolves once that version is on PyPI — so a real end-to-end boot cannot run
      # in CI pre-publish. We smoke that the wrapper is valid JavaScript (its only
      # real regression risk — it's a ~50-line, rarely-touched bootstrapper). Its
      # runtime behavior (uvx detection + arg/exit-code forwarding) is covered by
      # local dev checks and verified manually after each PyPI publish.
      - name: Smoke — wrapper is valid JavaScript
        shell: bash
        run: node --check npx-wrapper/bin/sap-bdc-mcp.js

      - name: Upload wrapper artifact (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: npx-wrapper-${{ matrix.os }}
          path: npx-wrapper/
