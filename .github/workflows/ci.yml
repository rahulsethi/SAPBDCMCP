# File: .github/workflows/ci.yml
# Version: v2

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: mypy src/sap_bdc_mcp

      - name: Tests
        run: pytest -q

  npx-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The wrapper boots the Python server via `uvx sap-bdc-mcp@<PIN>`, which only
      # resolves once that version is published to PyPI. Until then we test the
      # wrapper's OWN logic hermetically (no PyPI, no uv install required):
      #   1. it is valid JS,
      #   2. it exits 2 with an install hint when uvx is absent,
      #   3. (Linux) it forwards the correct args + exit code to uvx (via a stub).
      # The real end-to-end boot is verified manually after the PyPI publish.

      - name: Smoke — wrapper is valid JS and handles a missing uvx
        shell: bash
        run: |
          set -uo pipefail
          node --check npx-wrapper/bin/sap-bdc-mcp.js \
            || { echo "::error::wrapper is not valid JavaScript"; exit 1; }
          # GitHub-hosted runners do not ship uv/uvx, so the wrapper should take its
          # "uvx missing" branch: exit 2 and print an install hint. If a runner image
          # ever does have uvx, skip this assertion (a real boot would need the package
          # on PyPI) rather than fail — the Linux stub step below still covers forwarding.
          if command -v uvx >/dev/null 2>&1; then
            echo "::notice::uvx is present on this runner; skipping the missing-uvx assertion"
          else
            out="$(node npx-wrapper/bin/sap-bdc-mcp.js --help 2>&1)"; ec=$?
            printf '%s\n' "$out"
            echo "wrapper exit code: $ec"
            if [ "$ec" -ne 2 ]; then
              echo "::error::expected exit 2 when uvx is not installed, got $ec"
              exit 1
            fi
            printf '%s\n' "$out" | grep -qi "requires 'uvx'" \
              || { echo "::error::missing-uvx install hint was not printed"; exit 1; }
          fi

      - name: Smoke — wrapper forwards the correct args to uvx (stub, Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          stub="$(mktemp -d)"
          printf '#!/usr/bin/env bash\necho "STUB_UVX_ARGS: $*"\nexit 0\n' > "$stub/uvx"
          chmod +x "$stub/uvx"
          export PATH="$stub:$PATH"
          out="$(node npx-wrapper/bin/sap-bdc-mcp.js --help)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q -- "STUB_UVX_ARGS: --python 3.11 sap-bdc-mcp@0.2.0 --help" \
            || { echo "::error::wrapper did not forward the expected args to uvx"; exit 1; }

      - name: Upload wrapper artifact (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: npx-wrapper-${{ matrix.os }}
          path: npx-wrapper/
